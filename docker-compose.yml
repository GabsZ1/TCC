services:
  postgres:
    image: postgres:16
    container_name: salonhub-postgres
    environment:
      POSTGRES_DB: salonhub_db
      POSTGRES_USER: salonhub_user
      POSTGRES_PASSWORD: salonhub_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servidor SMTP de desenvolvimento: captura todos os e-mails enviados pelo backend.
  # Caixa de entrada visível em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: salonhub-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Armazenamento de imagens (SeaweedFS, compatível com S3). Os arquivos ficam aqui; o
  # PostgreSQL guarda só os metadados e a chave (storage_key) de cada arquivo.
  # API S3: http://localhost:8333 | Navegador de arquivos: http://localhost:8888
  # O bucket (S3_BUCKET) é criado automaticamente na subida.
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: salonhub-storage
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-salonhub_s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-salonhub_s3_pass}
      S3_BUCKET: ${S3_BUCKET:-salonhub-media}
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:
