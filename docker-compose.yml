services:
  postgres:
    image: postgres:16
    container_name: salonhub-postgres
    environment:
      POSTGRES_DB: salonhub_db
      POSTGRES_USER: salonhub_user
      POSTGRES_PASSWORD: salonhub_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servidor SMTP de desenvolvimento: captura todos os e-mails enviados pelo backend.
  # Caixa de entrada visível em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: salonhub-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Armazenamento de imagens (compatível com S3). Os arquivos ficam aqui; o PostgreSQL
  # guarda só os metadados e a chave (storage_key) de cada arquivo.
  # API S3: http://localhost:9000 | Console web: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: salonhub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salonhub_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-salonhub_minio_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Executa uma vez ao subir: cria o bucket das imagens (se ainda não existir) e encerra.
  minio-setup:
    image: minio/mc:latest
    container_name: salonhub-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salonhub_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-salonhub_minio_pass}
      MINIO_BUCKET: ${MINIO_BUCKET:-salonhub-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'Bucket '$$MINIO_BUCKET' pronto.'
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
