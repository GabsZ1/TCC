# Profile usado só pelo comando de popular o banco (ver README, "Dados de demonstração").
# Roda o DemoSeedRunner, grava os dados e encerra. A porta aleatória evita conflito
# com o backend, caso ele já esteja rodando na 8080.
server.port=0
spring.main.banner-mode=off
# O seed só grava os dados e encerra: sem tarefas agendadas.
app.notifications.reminders.enabled=false
