spring.application.name=salonhub
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/salonhub_db}
spring.datasource.username=${DB_USERNAME:salonhub_user}
spring.datasource.password=${DB_PASSWORD:salonhub_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.first-access.expiration-hours=${FIRST_ACCESS_EXPIRATION_HOURS:24}

app.system-admin.name=${SYSTEM_ADMIN_NAME:}
app.system-admin.email=${SYSTEM_ADMIN_EMAIL:}
app.system-admin.password=${SYSTEM_ADMIN_PASSWORD:}

app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# E-mail (em desenvolvimento, o Mailpit do docker-compose recebe tudo em http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:SalonHub <no-reply@salonhub.local>}

# Endereço do frontend usado nos links enviados por e-mail
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Em produção com frontend separado, informe as origens permitidas separadas por vírgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Recuperação de senha (US 2.20): validade do link e intervalo mínimo entre pedidos
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:120}

# Proteção contra força bruta e abuso dos formulários públicos (contadores em memória).
# Login: 5 senhas erradas no mesmo e-mail (ou 20 no mesmo IP) em 15 min bloqueiam por 15 min.
# Cadastros e recuperação de senha: até 10 pedidos por IP e por formulário a cada 60 min.
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.login.max-failures-per-email=${LOGIN_MAX_FAILURES_PER_EMAIL:5}
app.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:20}
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}
app.security.public-forms.max-requests-per-ip=${PUBLIC_FORMS_MAX_REQUESTS_PER_IP:10}
app.security.public-forms.window-minutes=${PUBLIC_FORMS_WINDOW_MINUTES:60}

# Foto do funcionário: até 2 MB (a aplicação também valida o tamanho e o formato)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Armazenamento de imagens. "s3" (padrão, usa o SeaweedFS do docker-compose ou outro servidor S3) ou "memory" (só para testes).
app.storage.type=${STORAGE_TYPE:s3}
app.storage.s3.endpoint=${S3_ENDPOINT:http://localhost:8333}
app.storage.s3.access-key=${S3_ACCESS_KEY:salonhub_s3}
app.storage.s3.secret-key=${S3_SECRET_KEY:salonhub_s3_pass}
app.storage.s3.bucket=${S3_BUCKET:salonhub-media}

app.geocoding.geoapify.api-key=${GEOAPIFY_API_KEY:}
app.geocoding.geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}
