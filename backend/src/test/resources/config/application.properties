# Carregado só nos testes, por cima do application.properties principal (classpath:/config/).
# A proteção contra tentativas repetidas guarda contadores em memória que não voltam atrás com o
# rollback dos testes; como todas as requisições do MockMvc vêm do mesmo IP, a suíte inteira
# esbarraria nos limites. O LoginRateLimitIntegrationTests liga a proteção com @TestPropertySource.
app.security.rate-limit.enabled=false

# Os testes rodam no banco local, que pode ter os agendamentos do seed: a tarefa de lembretes
# não pode rodar sozinha durante a suíte. O AppointmentNotificationsIntegrationTests chama o
# AppointmentReminderService diretamente.
app.notifications.reminders.enabled=false
